name: Package Folder and Upload to Release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  package-and-upload:
    runs-on: ubuntu-latest
    # 若本次 push 的 commit message 含有关键词 "nopackage"，则跳过整个 job
    if: ${{ !contains(github.event.head_commit.message, 'nopackage') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. 检测本次 push 涉及的顶层文件夹，并区分「修改」和「删除」
      - name: Detect changed / deleted top-level folders
        id: changed
        shell: bash
        run: |
          set -e
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            TOUCHED=$(find . -mindepth 1 -maxdepth 1 -type d -not -name '.*' -printf '%f\n' | sort -u)
          else
            TOUCHED=$(git diff --name-only "$BEFORE" "$AFTER" \
              | awk -F/ 'NF>1 && $1 !~ /^\./ {print $1}' \
              | sort -u)
          fi

          MODIFIED=""
          DELETED=""
          while IFS= read -r FOLDER; do
            [ -z "$FOLDER" ] && continue
            if [ -d "$FOLDER" ]; then
              MODIFIED="${MODIFIED}${FOLDER}"$'\n'
            else
              DELETED="${DELETED}${FOLDER}"$'\n'
            fi
          done <<< "$TOUCHED"

          echo "Modified folders:"
          echo "$MODIFIED"
          echo "Deleted folders:"
          echo "$DELETED"

          {
            echo "modified<<EOF"
            echo "$MODIFIED"
            echo "EOF"
            echo "deleted<<EOF"
            echo "$DELETED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # 2. 确保 release 存在
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v1.0
        shell: bash
        run: |
          set -e
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG not found, creating..."
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes "Auto-created release $RELEASE_TAG"
          fi

      # 3. 删除：文件夹已被删除 → 从 release 中移除对应 zip
      - name: Delete packages for removed folders
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v1.0
        shell: bash
        run: |
          set -e
          DELETED="${{ steps.changed.outputs.deleted }}"
          if [ -z "${DELETED// }" ]; then
            echo "No deleted folders."
            exit 0
          fi

          EXISTING_ASSETS=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' || true)

          while IFS= read -r FOLDER; do
            [ -z "$FOLDER" ] && continue
            ZIP_NAME="${FOLDER}.zip"
            if echo "$EXISTING_ASSETS" | grep -Fxq "$ZIP_NAME"; then
              echo "🗑 Deleting asset '$ZIP_NAME' from release $RELEASE_TAG..."
              gh release delete-asset "$RELEASE_TAG" "$ZIP_NAME" --yes
            else
              echo "Asset '$ZIP_NAME' not found in release, skip."
            fi
          done <<< "$DELETED"

      # 4. 打包：为每个「有改动」的文件夹重新生成 zip（不再跳过已存在）
      - name: Package modified folders
        shell: bash
        run: |
          set -e
          MODIFIED="${{ steps.changed.outputs.modified }}"
          : > packaged.txt

          if [ -z "${MODIFIED// }" ]; then
            echo "No folders to package."
            exit 0
          fi

          while IFS= read -r FOLDER; do
            [ -z "$FOLDER" ] && continue
            [ ! -d "$FOLDER" ] && { echo "Skip: '$FOLDER' is not a directory"; continue; }

            ZIP_NAME="${FOLDER}.zip"
            echo "📦 Creating '$ZIP_NAME' from contents of '$FOLDER' (no top-level folder)..."

            rm -f "$ZIP_NAME"
            (
              shopt -s dotglob nullglob
              cd "$FOLDER"
              zip -r "../$ZIP_NAME" ./*
            )

            echo "$ZIP_NAME" >> packaged.txt
          done <<< "$MODIFIED"

          echo "Packaged files:"
          cat packaged.txt

      # 5. 上传：覆盖 release 中同名资产
      - name: Upload packages to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v1.0
        shell: bash
        run: |
          set -e
          if [ ! -s packaged.txt ]; then
            echo "No packages to upload."
            exit 0
          fi

          while IFS= read -r ZIP_NAME; do
            [ -z "$ZIP_NAME" ] && continue
            [ ! -f "$ZIP_NAME" ] && { echo "Skip: '$ZIP_NAME' not found"; continue; }

            echo "🚀 Uploading '$ZIP_NAME' to release $RELEASE_TAG..."
            gh release upload "$RELEASE_TAG" "$ZIP_NAME" --clobber
          done < packaged.txt